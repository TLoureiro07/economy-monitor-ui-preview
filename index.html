<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Economy Monitor — UI Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/utilities.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/preview.css" />
</head>
<body>
  <div id="app">
    <div class="ei-shell ds-layer">
      <div class="ds-ambient" aria-hidden="true">
        <div class="ds-ambient__blob ds-ambient__blob--accent"></div>
        <div class="ds-ambient__blob ds-ambient__blob--warm"></div>
      </div>

      <header class="ei-topnav">
        <div class="ds-brand" title="Economy Monitor Demo">
          <span class="ds-brand__mark" aria-hidden="true"></span>
          <span id="ei-brand-text">Economy Monitor</span>
        </div>

        <div class="ei-topnav__center">
          <nav class="ds-pill-nav" aria-label="Navigation">
            <button class="ds-pill-nav__item is-active" data-route="overview" type="button" data-i18n="nav_overview">Overview</button>
            <button class="ds-pill-nav__item" data-route="timeline" type="button" data-i18n="nav_timeline">Timeline</button>
            <button class="ds-pill-nav__item" data-route="players" type="button" data-i18n="nav_players">Players</button>
            <button class="ds-pill-nav__item" data-route="statistics" type="button" data-i18n="nav_statistics">Statistics</button>
            <button class="ds-pill-nav__item" data-route="alerts" type="button" data-i18n="nav_alerts">Alerts</button>
          </nav>
        </div>

        <div class="ei-topnav__right">
          <button class="ds-icon-btn" id="btn-theme" type="button" data-i18n-title="theme_toggle" title="Theme" aria-label="Theme">
            <svg class="ei-theme-icon ei-theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.3A9 9 0 1 1 9.7 3a7 7 0 0 0 11.3 11.3z"/></svg>
            <svg class="ei-theme-icon ei-theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
          <button class="ds-icon-btn" id="btn-settings" type="button" data-i18n-title="nav_settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="ds-icon-btn" id="btn-refresh" type="button" data-i18n-title="refresh" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.3-6"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button class="ds-icon-btn" id="btn-close" type="button" data-i18n-title="close" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </header>

      <div class="ei-pagehead">
        <div>
          <h1 class="ei-pagehead__title" id="page-title">Overview</h1>
          <p class="ei-pagehead__sub" id="page-subtitle">Economy Monitor</p>
        </div>
        <div class="ei-pagehead__metrics" id="page-metrics" hidden></div>
      </div>

      <div class="ei-content ds-scroll" id="page-root"></div>
    </div>
  </div>

  <script src="/js/locales-en.js"></script>
  <script src="/vendor/chart.min.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/window.js"></script>
  <script src="/js/mockData.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/pages/overview.js"></script>
  <script src="/js/pages/timeline.js"></script>
  <script src="/js/pages/players.js"></script>
  <script src="/js/pages/statistics.js"></script>
  <script src="/js/pages/alerts.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/bootstrap.js"></script>
</body>
</html>
